name: Deploy to GitHub Pages

on:
  # Deploy on every push to main (the repo's default branch).
  push:
    branches: [main]
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Let the job read the repo and publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push queues behind a running one
# instead of cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runs `npm ci` then `npm run build`, so prebuild (tokens, fonts, badges,
      # brand assets) and postbuild (robots/sitemap + check-publish gate) both
      # run. A failing gate fails this job and nothing is deployed.
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
