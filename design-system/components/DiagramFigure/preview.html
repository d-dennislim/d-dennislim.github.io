<!-- @dsCard group="Content" height=480 width=760 -->
<div class="ds-canvas" style="padding:24px">
  <figure class="diagram-figure">
    <svg viewBox="0 0 680 320" width="100%" role="img"
         aria-label="Requests enter through an application load balancer in a public subnet, reach a container task in a private subnet, and the database and object storage sit in that private subnet with no route to the internet.">
      <defs>
        <marker id="dgArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L8 4 L0 8 z" fill="var(--diagram-flow)" />
        </marker>
        <marker id="dgArrowAlt" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0 L8 4 L0 8 z" fill="var(--diagram-flow-alt)" />
        </marker>
      </defs>

      <text class="dg-label" x="157" y="18" text-anchor="middle">Internet</text>
      <path class="dg-flow" d="M 157 26 V 124" marker-end="url(#dgArrow)" />

      <rect class="dg-boundary" x="10" y="40" width="660" height="266" rx="10" />
      <text class="dg-label" x="22" y="60">Region</text>

      <rect class="dg-network" x="26" y="68" width="628" height="226" rx="8" />
      <text class="dg-label" x="38" y="88">VPC</text>

      <rect class="dg-zone-public" x="42" y="98" width="270" height="186" rx="6" />
      <text class="dg-label" x="54" y="118">Public subnet</text>

      <rect class="dg-zone-private" x="330" y="98" width="308" height="186" rx="6" />
      <text class="dg-label" x="342" y="118">Private subnet</text>

      <rect class="dg-node-aws" x="62" y="132" width="190" height="44" rx="6" />
      <text class="dg-node-label" x="157" y="159" text-anchor="middle">Load balancer</text>

      <rect class="dg-node" x="352" y="132" width="130" height="44" rx="6" />
      <text class="dg-node-label" x="417" y="159" text-anchor="middle">Container task</text>

      <rect class="dg-node-aws" x="500" y="132" width="120" height="44" rx="6" />
      <text class="dg-node-label" x="560" y="159" text-anchor="middle">Database</text>

      <rect class="dg-node-alt" x="352" y="212" width="130" height="44" rx="6" />
      <text class="dg-node-label" x="417" y="239" text-anchor="middle">Object store</text>

      <path class="dg-flow" d="M 252 154 H 344" marker-end="url(#dgArrow)" />
      <path class="dg-flow" d="M 482 154 H 492" marker-end="url(#dgArrow)" />
      <path class="dg-flow-alt" d="M 417 176 V 204" marker-end="url(#dgArrowAlt)" />

      <text class="dg-annotation" x="298" y="144" text-anchor="middle">hot path</text>
      <text class="dg-label" x="430" y="196">async</text>
    </svg>
    <figcaption class="body-sm diagram-caption">
      Solid lines are the synchronous request path, dashed are asynchronous. Amber nodes are AWS-managed; blue is the service you own.
    </figcaption>
  </figure>
</div>
